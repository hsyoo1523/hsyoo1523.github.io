<!DOCTYPE html>
<html lang="ko">
  {%- include head.html -%}
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    .markmap { width: 100vw; height: 100vh; }
    #back {
      position: fixed;
      top: 14px; left: 18px;
      z-index: 999;
      font-size: 13px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    #back:hover { opacity: 1; }
  </style>
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <a id="back" href="{{ site.baseurl }}/">← home</a>
    <div class="markmap">
      <script type="text/template">
{{ page.mindmap }}
      </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16"></script>
  </body>
</html>
