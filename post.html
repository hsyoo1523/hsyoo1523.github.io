<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Note</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #06080f;
            color: rgba(255,255,255,0.82);
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            min-height: 100vh;
            line-height: 1.85;
        }

        header {
            position: sticky; top: 0;
            background: rgba(6,8,15,0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .back {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 13px;
            display: flex; align-items: center; gap: 5px;
            transition: color 0.2s;
        }
        .back:hover { color: rgba(255,255,255,0.85); }

        .sep { color: rgba(255,255,255,0.18); font-size: 12px; }

        #page-title {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        main {
            max-width: 740px;
            margin: 0 auto;
            padding: 52px 32px 100px;
        }

        /* ── 마크다운 스타일 ── */
        #content h1 {
            font-size: 2rem; font-weight: 600;
            color: #fff;
            margin-bottom: 28px;
            line-height: 1.3;
        }
        #content h2 {
            font-size: 1.35rem; font-weight: 600;
            color: rgba(255,255,255,0.88);
            margin: 44px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        #content h3 {
            font-size: 1.08rem; font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin: 30px 0 12px;
        }
        #content p { margin-bottom: 18px; }
        #content ul, #content ol {
            margin: 10px 0 18px 22px;
        }
        #content li { margin-bottom: 7px; }
        #content strong { color: #fff; }
        #content em { color: rgba(255,255,255,0.65); }
        #content a { color: #818cf8; text-decoration: none; }
        #content a:hover { text-decoration: underline; }
        #content hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.07);
            margin: 36px 0;
        }
        #content blockquote {
            border-left: 3px solid rgba(129,140,248,0.5);
            padding: 4px 0 4px 18px;
            color: rgba(255,255,255,0.55);
            margin: 20px 0;
            font-style: italic;
        }
        #content code {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 4px;
            padding: 2px 7px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.87em;
            color: #a5b4fc;
        }
        #content pre {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 22px 24px;
            overflow-x: auto;
            margin: 20px 0;
        }
        #content pre code {
            background: none; border: none; padding: 0;
            font-size: 0.9em; color: rgba(255,255,255,0.8);
        }

        /* 상태 메시지 */
        .state {
            text-align: center;
            margin-top: 100px;
            color: rgba(255,255,255,0.25);
            font-size: 14px;
        }
        .state.error { color: rgba(248,113,113,0.7); }
        .state code {
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back">← 마인드맵</a>
        <span class="sep">/</span>
        <span id="page-title">로딩 중…</span>
    </header>

    <main>
        <div id="status" class="state">로딩 중…</div>
        <div id="content"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const file = new URLSearchParams(location.search).get('file');

        if (!file) {
            showError('URL에 <code>?file=파일명</code> 이 없어요.');
        } else {
            fetch(`posts/${file}.md`)
                .then(r => { if (!r.ok) throw new Error(); return r.text(); })
                .then(md => {
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('content').innerHTML = marked.parse(md);
                    const h1 = document.querySelector('#content h1');
                    const title = h1 ? h1.textContent : file;
                    document.title = title + ' · Study Note';
                    document.getElementById('page-title').textContent = title;
                })
                .catch(() => showError(
                    `<code>posts/${file}.md</code> 파일이 없어요.<br>해당 경로에 마크다운 파일을 추가해 주세요.`
                ));
        }

        function showError(msg) {
            const el = document.getElementById('status');
            el.className = 'state error';
            el.innerHTML = msg;
        }
    </script>
</body>
</html>
