<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Map · hsyoo1523</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #06080f;
            font-family: 'Noto Sans KR', system-ui, sans-serif;
        }

        #bg { position: fixed; inset: 0; pointer-events: none; }

        #mindmap { position: fixed; inset: 0; width: 100%; height: 100%; }

        #site-title {
            position: fixed;
            top: 22px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 300;
            pointer-events: none;
        }

        #hint {
            position: fixed;
            bottom: 18px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.18);
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
        }

        .tooltip {
            position: fixed;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 5px 13px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="site-title">STUDY MAP</div>
    <canvas id="bg"></canvas>
    <svg id="mindmap"></svg>
    <div class="tooltip" id="tip"></div>
    <div id="hint">스크롤 확대/축소 &nbsp;·&nbsp; 드래그 이동 &nbsp;·&nbsp; 노드 클릭으로 페이지 이동</div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
    // ===================================================
    //  마인드맵 데이터 — 여기를 수정하세요!
    //
    //  카테고리 추가: { name: "이름", color: "#색상코드", children: [...] }
    //  노트 추가:     { name: "이름", file: "파일명" }  → posts/파일명.md
    // ===================================================
    const MAP = {
        name: "hsyoo1523",
        children: [
            {
                name: "알고리즘",
                color: "#f87171",
                children: [
                    { name: "DP", file: "algorithm-dp" },
                    { name: "그래프 탐색", file: "algorithm-graph" },
                    { name: "정렬", file: "algorithm-sort" },
                ]
            },
            {
                name: "웹개발",
                color: "#34d399",
                children: [
                    { name: "JavaScript", file: "web-js" },
                    { name: "React", file: "web-react" },
                    { name: "CSS", file: "web-css" },
                ]
            },
            {
                name: "CS 기초",
                color: "#818cf8",
                children: [
                    { name: "운영체제", file: "cs-os" },
                    { name: "네트워크", file: "cs-network" },
                    { name: "데이터베이스", file: "cs-db" },
                ]
            },
            {
                name: "수학",
                color: "#fbbf24",
                children: [
                    { name: "선형대수", file: "math-linear" },
                    { name: "확률/통계", file: "math-stats" },
                ]
            },
        ]
    };

    // ===================================================
    //  별 배경
    // ===================================================
    (function () {
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            stars = Array.from({ length: 180 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.1 + 0.1,
                a: Math.random() * 0.5 + 0.1,
                da: (Math.random() - 0.5) * 0.008,
            }));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.a = Math.max(0.05, Math.min(0.65, s.a + s.da));
                if (Math.random() < 0.003) s.da *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.a.toFixed(2)})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        resize();
        draw();
        window.addEventListener('resize', resize);
    })();

    // ===================================================
    //  마인드맵
    // ===================================================
    const W = innerWidth, H = innerHeight;
    const RADIUS = Math.min(W, H) * 0.36;

    const svg = d3.select('#mindmap');
    const defs = svg.append('defs');

    // 글로우 필터
    const glow = defs.append('filter').attr('id', 'glow')
        .attr('x', '-60%').attr('y', '-60%').attr('width', '220%').attr('height', '220%');
    glow.append('feGaussianBlur').attr('in', 'SourceGraphic').attr('stdDeviation', '5').attr('result', 'b');
    const m = glow.append('feMerge');
    m.append('feMergeNode').attr('in', 'b');
    m.append('feMergeNode').attr('in', 'SourceGraphic');

    // 루트 그라디언트
    const rg = defs.append('radialGradient').attr('id', 'rg');
    rg.append('stop').attr('offset', '0%').attr('stop-color', '#fff');
    rg.append('stop').attr('offset', '100%').attr('stop-color', '#c7d2fe');

    const g = svg.append('g');

    // 줌 / 패닝
    const zoom = d3.zoom().scaleExtent([0.15, 5])
        .on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom).on('dblclick.zoom', null);
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2));

    // 트리 레이아웃
    const tree = d3.tree()
        .size([2 * Math.PI, RADIUS])
        .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth);

    const root = d3.hierarchy(MAP);
    tree(root);

    function ancestorColor(d) {
        let n = d;
        while (n.depth > 1) n = n.parent;
        return n.data.color || '#888';
    }

    function toXY(d) {
        const a = d.x - Math.PI / 2;
        return [d.y * Math.cos(a), d.y * Math.sin(a)];
    }

    // 링크
    const linkFn = d3.linkRadial().angle(d => d.x).radius(d => d.y);
    g.selectAll('.lk')
        .data(root.links())
        .join('path')
        .attr('fill', 'none')
        .attr('stroke', d => ancestorColor(d.target))
        .attr('stroke-opacity', 0.25)
        .attr('stroke-width', d => d.target.depth === 1 ? 2 : 1.2)
        .attr('d', linkFn)
        .attr('stroke-dasharray', function () { return this.getTotalLength(); })
        .attr('stroke-dashoffset', function () { return this.getTotalLength(); })
        .transition().duration(900).delay((_, i) => i * 40)
        .attr('stroke-dashoffset', 0);

    // 툴팁
    const tip = d3.select('#tip');

    // 노드 그룹
    const node = g.selectAll('.nd')
        .data(root.descendants())
        .join('g')
        .attr('transform', d => {
            const [x, y] = toXY(d);
            return d.depth === 0 ? 'translate(0,0)' : `translate(${x},${y})`;
        })
        .style('opacity', 0)
        .on('click', (_, d) => {
            if (d.data.file) location.href = `post.html?file=${d.data.file}`;
        })
        .on('mouseover', (e, d) => {
            if (!d.data.file && d.depth === 0) return;
            tip.style('opacity', 1)
               .text((d.data.file ? '📄 ' : '📁 ') + d.data.name);
        })
        .on('mousemove', e => {
            tip.style('left', e.clientX + 16 + 'px').style('top', e.clientY - 8 + 'px');
        })
        .on('mouseleave', () => tip.style('opacity', 0));

    node.transition().duration(600).delay((_, i) => 150 + i * 45).style('opacity', 1);

    // 원
    const R0 = 42, R1 = 26, R2 = 14;
    node.append('circle')
        .attr('r', d => d.depth === 0 ? R0 : d.depth === 1 ? R1 : R2)
        .attr('fill', d => {
            if (d.depth === 0) return 'url(#rg)';
            const c = ancestorColor(d);
            return d.depth === 1 ? c : c + 'aa';
        })
        .attr('stroke', d => d.depth === 0 ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)')
        .attr('stroke-width', d => d.depth === 0 ? 2 : 1)
        .style('filter', d => d.depth <= 1 ? 'url(#glow)' : 'none')
        .style('cursor', d => d.data.file ? 'pointer' : 'default')
        .on('mouseover', function (_, d) {
            const r = d.depth === 0 ? R0 : d.depth === 1 ? R1 : R2;
            d3.select(this).transition().duration(140).attr('r', r + 4);
        })
        .on('mouseleave', function (_, d) {
            const r = d.depth === 0 ? R0 : d.depth === 1 ? R1 : R2;
            d3.select(this).transition().duration(140).attr('r', r);
        });

    // 루트 펄스 애니메이션
    (function pulse() {
        g.select('circle')
            .transition().duration(1800).attr('r', R0 + 5).attr('stroke-opacity', 0.1)
            .transition().duration(1800).attr('r', R0).attr('stroke-opacity', 0.5)
            .on('end', pulse);
    })();

    // 텍스트
    node.append('text')
        .attr('dy', '0.35em')
        .attr('x', d => {
            if (d.depth === 0) return 0;
            const a = d.x - Math.PI / 2;
            const right = Math.cos(a) >= 0;
            return right ? (d.depth === 1 ? 33 : 20) : -(d.depth === 1 ? 33 : 20);
        })
        .attr('text-anchor', d => {
            if (d.depth === 0) return 'middle';
            const a = d.x - Math.PI / 2;
            return Math.cos(a) >= 0 ? 'start' : 'end';
        })
        .text(d => d.data.name)
        .style('fill', d => d.depth === 0 ? '#0f172a' : 'rgba(255,255,255,0.88)')
        .style('font-size', d => d.depth === 0 ? '14px' : d.depth === 1 ? '13px' : '11px')
        .style('font-weight', d => d.depth <= 1 ? '600' : '400')
        .style('text-shadow', d => d.depth > 0 ? '0 1px 6px rgba(0,0,0,0.9)' : 'none')
        .style('pointer-events', 'none')
        .style('user-select', 'none');
    </script>
</body>
</html>
